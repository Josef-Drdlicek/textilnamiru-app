<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Textil na míru – zakázky</title>
  <style>
/* Textil na míru – nová aplikace */

:root {
  /* Barvy z veřejného webu APP (resources/css/app.css) — jen paleta, ne tvar. */
  --bg: #faf9f7;
  --surface: #fff;
  --surface-alt: #f2efe9;
  --text: #141b1e;
  --muted: #5f5b55;
  --border: #e7e2da;
  --primary: #141b1e;
  --primary-hover: #2a3439;
  --accent: #a84b1f;
  --accent-soft: #fbf3ee;
  --danger: #a33;
  --success: #2e7d32;
  --success-text: #2e7d32;
  --on-primary: #fff;
  /* Levé admin menu: černá jako patička webu (--primary / ink), oranžová jako akcent. */
  --menu-bg: var(--primary);
  --menu-text: var(--on-primary);
  --menu-aktivni: var(--accent);
  --menu-hover: var(--primary-hover);
  --radius: 8px;
  --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
  font-family: 'Segoe UI', system-ui, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

#header {
  padding: 1rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

#logo img,
#logo-svg {
  max-height: 60px;
  width: auto;
  display: block;
}

#menu {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1rem;
}

.menu-item,
.menu-item-selected {
  padding: 0.5rem 0.75rem;
}

.menu-item-selected {
  font-weight: 700;
  border-bottom: 2px solid var(--text);
}

.menu-item a {
  color: inherit;
  text-decoration: none;
}

.menu-item a:hover {
  text-decoration: underline;
}

#customer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 1rem;
  background: var(--surface-alt);
  border-bottom: 1px solid var(--border);
}

#profile .logout {
  color: var(--danger);
}

.admin-page #content {
  padding: 1rem 1.5rem;
}

.admin-body {
  display: flex;
  flex: 1;
  align-items: stretch;
  min-width: 0;
}

.admin-sidebar {
  flex: 0 0 220px;
  width: 220px;
  background: var(--menu-bg);
  border-right: 1px solid var(--menu-bg);
  padding: 1rem 0.75rem;
}

.admin-nav {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.admin-nav-link {
  display: block;
  padding: 0.6rem 0.85rem;
  color: var(--menu-text);
  text-decoration: none;
  border-radius: var(--radius);
  border: 2px solid transparent;
}

.admin-nav-link:hover {
  background: var(--menu-hover);
}

.admin-nav-link:focus-visible {
  outline: none;
  border-color: var(--menu-aktivni);
}

.admin-nav-link.is-active {
  font-weight: 700;
  background: var(--menu-aktivni);
  color: var(--menu-text);
}

.admin-nav-link.is-active:hover {
  background: var(--menu-aktivni);
  color: var(--menu-text);
}

.admin-nav-toggle {
  display: none;
  margin-right: 0.75rem;
  padding: 0.4rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  cursor: pointer;
}

.admin-nav-toggle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.admin-nav-overlay {
  display: none;
}

@media (max-width: 800px) {
  .admin-nav-toggle {
    display: inline-flex;
    align-items: center;
  }

  .admin-sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 40;
    transform: translateX(-100%);
    box-shadow: var(--shadow);
  }

  .admin-sidebar.is-open {
    transform: translateX(0);
  }

  .admin-nav-overlay:not([hidden]) {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(20, 27, 30, 0.4);
  }
}

.site-main {
  flex: 1;
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
  padding: 1.5rem;
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a {
  color: var(--accent);
}

.page-title {
  margin: 0 0 1.25rem;
  font-size: 1.5rem;
}

/* Pole názvu zakázky v klonu Cenové nabídky — stejné jako .form input. */
.page-title:has(.quote-oznaceni-pole) {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 0.75rem;
}

.page-title:has(.quote-oznaceni-pole) label {
  font-size: 1.5rem;
  font-weight: inherit;
}

.quote-oznaceni-pole {
  padding: 0.5rem 0.65rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font: inherit;
  font-size: 1rem;
  font-weight: 400;
  flex: 1 1 12rem;
  min-width: 0;
  max-width: 100%;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
}

.panel h2 {
  margin: 0 0 1rem;
  font-size: 1.1rem;
}

.toolbar {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin: 1rem 0;
}

.btn {
  display: inline-block;
  padding: 0.5rem 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
  font: inherit;
}

.btn:hover {
  background: var(--bg);
}

.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--on-primary);
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-muted {
  color: var(--muted);
}

.btn-danger {
  border-color: var(--danger);
  color: var(--danger);
}

.btn-danger:hover {
  background: color-mix(in srgb, var(--danger) 12%, transparent);
}

.btn-danger:focus-visible {
  outline: 2px solid var(--danger);
  outline-offset: 2px;
}

.btn-success {
  border-color: var(--success);
  color: var(--success-text);
  background: transparent;
}

.btn-success:hover {
  background: color-mix(in srgb, var(--success) 12%, transparent);
}

.btn-success:focus-visible {
  outline: 2px solid var(--success);
  outline-offset: 2px;
}

.btn-sm {
  padding: 0.25rem 0.6rem;
  font-size: 0.875rem;
}

.form {
  display: grid;
  gap: 0.75rem;
}

.form-narrow {
  max-width: 480px;
}

.form label {
  display: grid;
  gap: 0.25rem;
  font-size: 0.9rem;
}

.form input,
.form select,
.form textarea {
  padding: 0.5rem 0.65rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font: inherit;
}

.checkbox {
  display: flex !important;
  align-items: center;
  gap: 0.5rem;
}

.form-error {
  color: var(--danger);
  margin: 0;
}

.input-sm {
  width: 100px;
}

.input-ratios {
  width: 12rem;
}

.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  /* Šířka Smazat: mezera za akcí / Detailem je její polovina. */
  --akce-smazat-sirka: 5.5rem;
}

.data-table th,
.data-table td {
  padding: 0.6rem 0.75rem;
  border-bottom: 1px solid var(--border);
  text-align: left;
}

.data-table th {
  background: var(--bg);
  font-weight: 600;
}

.data-table .empty {
  color: var(--muted);
  text-align: center;
}

.data-table .actions {
  white-space: nowrap;
}

.order-tables-posuv {
  overflow-x: auto;
}

/* Jen admin Zakázky. Původní mezera = vycentrování .site-main (max 1100px) + padding 1.5rem. */
.seznam-zakazek-admin {
  --zakazky-menu-sirka: 220px;
  --zakazky-obsah-max: 1100px;
  --zakazky-obsah-padding: 1.5rem;
  --zakazky-mezera-od-menu-puvodni: calc(
    max(0px, (100vw - var(--zakazky-menu-sirka) - var(--zakazky-obsah-max)) / 2) + var(--zakazky-obsah-padding)
  );
  --zakazky-mezera-od-menu: calc(var(--zakazky-mezera-od-menu-puvodni) / 2);
  /* Stejný okraj vlevo i vpravo; width:auto se zápornými okraji blok rozšíří. */
  margin-left: calc(var(--zakazky-mezera-od-menu) - var(--zakazky-mezera-od-menu-puvodni));
  margin-right: calc(var(--zakazky-mezera-od-menu) - var(--zakazky-mezera-od-menu-puvodni));
}

@media (max-width: 800px) {
  .seznam-zakazek-admin {
    margin-left: 0;
    margin-right: 0;
  }
}

.order-section {
  margin-bottom: 2rem;
  /* Pravítko: A 0 cm, D 6 cm, F 10 cm, G 12 cm, I 16 cm, L 22 cm, N 26 cm, P 30 cm. */
  --sloupec-zakaznik: 6cm;
  --sloupec-nazev: 4cm;
  --sloupec-datum: 4cm;
  --mezera-pred-cenou-bez: 2cm;
  --sloupec-cena-bez: 2cm;
  --sloupec-cena-dph: 8cm;
  --sloupec-akce: 18rem;
  /* Levý okraj Smazat = čára P; začátek sloupce Akce = čára N. */
  --pozice-smazat: 30cm;
  --sloupec-akce-od-leva: 26cm;
}

.order-section .data-table {
  table-layout: fixed;
  width: calc(26cm + var(--sloupec-akce));
  min-width: calc(26cm + var(--sloupec-akce));
}

.order-section .col-nazev {
  width: var(--sloupec-nazev);
}

.order-section .col-zakaznik {
  width: var(--sloupec-zakaznik);
}

.order-section .col-cena-bez {
  width: var(--sloupec-cena-bez);
}

.order-section .col-cena-dph {
  width: var(--sloupec-cena-dph);
}

.order-section .col-datum {
  width: var(--sloupec-datum);
}

.order-section .col-akce {
  width: var(--sloupec-akce);
}

.order-section .col-mezera-hi {
  width: var(--mezera-pred-cenou-bez);
}

/* Zákazník na A, Název na D, Cena bez DPH na I, Akce na N: text / tlačítko u čáry. */
.order-section .data-table th:nth-child(1),
.order-section .data-table td:nth-child(1),
.order-section .data-table th:nth-child(2),
.order-section .data-table td:nth-child(2),
.order-section .data-table th:nth-child(5),
.order-section .data-table td:nth-child(5),
.order-section .data-table th:nth-child(7),
.order-section .data-table td:nth-child(7) {
  padding-left: 0;
}

/* Datum na G a Cena vč. DPH na L — střed sloupce beze změny. */
.order-section .data-table th:nth-child(3),
.order-section .data-table td:nth-child(3),
.order-section .data-table th:nth-child(6),
.order-section .data-table td:nth-child(6) {
  text-align: center;
}

.order-section .data-table th:nth-child(5),
.order-section .data-table td:nth-child(5) {
  text-align: left;
}

/* Dlouhý text se zalamuje, neořezává. */
.order-section .data-table td:nth-child(1),
.order-section .data-table td:nth-child(2),
.order-section .data-table th:nth-child(5),
.order-section .data-table td:nth-child(5) {
  overflow-wrap: anywhere;
  white-space: normal;
}

.order-section .data-table .actions,
.seznam-zakazek .data-table .actions {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  column-gap: calc(var(--akce-smazat-sirka) / 2);
  white-space: nowrap;
}

.order-section .data-table .actions {
  justify-content: flex-start;
  position: relative;
}

/* Smazat na čáře P; černá akce zůstává na začátku sloupce Akce. */
.order-section .data-table .smazat-na-pravitku {
  position: absolute;
  left: calc(var(--pozice-smazat) - var(--sloupec-akce-od-leva));
  top: 50%;
  transform: translateY(-50%);
}

.seznam-zakazek .data-table .actions {
  justify-content: flex-end;
}

/* Studio Zakázky: sloupec akcí drží naměřenou šířku 363 px, ať Detail a Smazat zůstanou. */
.seznam-zakazek .data-table {
  table-layout: fixed;
}

.seznam-zakazek .col-akce {
  width: 363px;
}

.seznam-zakazek .data-table th:nth-child(3),
.seznam-zakazek .data-table td:nth-child(3) {
  text-align: left;
}

.seznam-zakazek .data-table td:nth-child(1) {
  overflow-wrap: anywhere;
  white-space: normal;
}

/* Rezerva šířky Smazat, ať Detail sedí ve všech řádcích stejně. */
.seznam-zakazek .akce-smazat-misto {
  flex: 0 0 var(--akce-smazat-sirka);
  width: var(--akce-smazat-sirka);
  display: flex;
  justify-content: flex-end;
  box-sizing: border-box;
}

@media (max-width: 40rem) {
  .order-section .data-table {
    table-layout: auto;
    width: 100%;
    min-width: 0;
  }

  .order-section .col-mezera-hi,
  .order-section .data-table .col-mezera-hi {
    display: none;
  }

  .order-section .data-table .actions,
  .seznam-zakazek .data-table .actions {
    flex-wrap: wrap;
    white-space: normal;
    row-gap: 0.35rem;
  }

  .order-section .data-table .smazat-na-pravitku {
    position: static;
    left: auto;
    top: auto;
    transform: none;
  }

  .seznam-zakazek .data-table {
    table-layout: auto;
  }

  .seznam-zakazek .col-akce {
    width: auto;
  }
}

.pricing-section {
  margin: 2rem 0;
}

.pricing-section h2 {
  font-size: 1.1rem;
  margin: 0 0 0.35rem;
}

.pricing-section > p {
  margin: 0 0 0.75rem;
  color: var(--muted);
  font-size: 0.9rem;
}

.order-section h2 {
  font-size: 1.1rem;
  margin-bottom: 0.5rem;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 0.75rem;
}

.product-card {
  display: grid;
  gap: 0.25rem;
  padding: 1rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-decoration: none;
  color: inherit;
  transition: border-color 0.15s;
}

.product-card:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.product-card span {
  font-size: 0.85rem;
  color: var(--muted);
}

.product-form {
  max-width: 520px;
  background: var(--surface);
  padding: 1.25rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

.price-box {
  padding: 1rem;
  background: var(--bg);
  border-radius: var(--radius);
  margin: 0.5rem 0;
}

.price-box p {
  margin: 0.25rem 0;
}

.login-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 1rem;
}

.login-card {
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  padding: 2rem;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.login-card h1 {
  margin: 0 0 0.25rem;
  font-size: 1.4rem;
}

.login-brand-heading {
  font-size: 1.4rem;
}

.login-brand {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  max-width: 100%;
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  border-radius: var(--radius);
}

.login-brand:hover {
  color: var(--accent);
}

.login-brand:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.login-brand-logo {
  display: block;
  flex-shrink: 0;
  width: 1.25em;
  height: 1.25em;
  overflow: hidden;
  border-radius: 50%;
  background: var(--surface);
}

.login-brand-logo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.login-sub {
  color: var(--muted);
  margin: 0 0 1.5rem;
}

.login-hint {
  margin-top: 1.5rem;
  font-size: 0.8rem;
  color: var(--muted);
}

.success-box {
  background: var(--surface);
  padding: 2rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  max-width: 480px;
}

.schema-sheet {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  max-width: 640px;
}

.schema-header h2 {
  margin: 0 0 0.25rem;
}

.schema-body {
  display: grid;
  gap: 1rem;
  margin: 1rem 0;
}

.schema-table th {
  text-align: left;
  padding-right: 1rem;
  color: var(--muted);
  font-weight: 500;
}

.schema-svg {
  width: 100%;
  max-width: 300px;
  background: var(--bg);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

.schema-footer {
  font-size: 0.9rem;
  color: var(--muted);
}

@media print {
  #header,
  #customer,
  .toolbar,
  .page-title,
  .admin-sidebar,
  .admin-nav-toggle,
  .admin-nav-overlay {
    display: none !important;
  }

  .schema-sheet {
    border: none;
    box-shadow: none;
  }
}

@media (max-width: 600px) {
  .site-main {
    padding: 1rem;
  }
}

#logo-svg { height: 40px; }
  </style>
</head>

function varByCode(variables, code) {

function roundPrice(value) {

function withVat(netPrice, variables) {

function read(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function write(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

/** Do uloženého ceníku doplní chybějící výchozí kódy, ceny uživatele nepřepisuje. */
function withMissingVariables(stored) {
  const list = Array.isArray(stored) ? [...stored] : [];
  const codes = new Set(list.map((v) => v.code));
  for (const def of DEFAULT_VARIABLES) {
    if (!codes.has(def.code)) {
      list.push({ ...def });
      codes.add(def.code);
    }
  }
  return list;
}

function initStorage() {
  const raw = localStorage.getItem(KEYS.variables);
  if (!raw) {
    write(KEYS.variables, DEFAULT_VARIABLES);
  } else {
    const stored = read(KEYS.variables, DEFAULT_VARIABLES);
    const merged = withMissingVariables(stored);
    if (merged.length !== stored.length) {
      write(KEYS.variables, merged);
    }
  }
  const rawStuhy = localStorage.getItem(KEYS.stuhy);
  if (!rawStuhy) {
    write(KEYS.stuhy, serializovatStuhy(STUHY));
  } else {
    const stored = read(KEYS.stuhy, {});
    const merged = withMissingStuhy(stored);
    write(KEYS.stuhy, merged);
  }
  uplatnitUlozeneStuhy();
  if (!localStorage.getItem(KEYS.users)) {
    write(KEYS.users, DEMO_USERS);
  }
  if (!localStorage.getItem(KEYS.orders)) {
    write(KEYS.orders, []);
  }
  if (!localStorage.getItem(KEYS.quotes)) {
    write(KEYS.quotes, []);
  }
}

function serializovatStuhy(src) {
  const out = {};
  for (const [code, item] of Object.entries(src)) {
    out[code] = {
      price: item.price,
      ratios: Array.isArray(item.ratios) ? [...item.ratios] : [],
    };
  }
  return out;
}

/** Chybějící kódy stuh doplní, uložené ceny a poměry nepřepisuje. */
function withMissingStuhy(stored) {
  const out = stored && typeof stored === 'object' ? { ...stored } : {};
  for (const [code, def] of Object.entries(serializovatStuhy(STUHY))) {
    if (!out[code]) out[code] = def;
  }
  return out;
}

/** Uložené ceny stuh zapíše do objektu STUHY, ať je kalkulace čte beze změny vzorců. */
function uplatnitUlozeneStuhy() {
  const stored = getStuhy();
  for (const code of Object.keys(STUHY)) {
    const s = stored[code];
    if (!s) continue;
    if (s.price != null && s.price !== '') STUHY[code].price = Number(s.price);
    if (Array.isArray(s.ratios)) STUHY[code].ratios = s.ratios.map(String);
  }
}

function getStuhy() {
  return withMissingStuhy(read(KEYS.stuhy, serializovatStuhy(STUHY)));
}

function saveStuhy(stuhy) {

function login(loginName, password) {

  );
  if (!user) return { ok: false, error: 'Neplatné přihlašovací údaje.' };
  const { password: _, ...safeUser } = user;
  setSession({ user: safeUser, loggedAt: Date.now() });
  return { ok: true, user: safeUser };
}

  setSession(null);
}

  const session = getSession();
  return session?.user ?? null;
}

function requireAuth(isAdmin = null) {
  const user = currentUser();
  if (!user) return { ok: false, redirect: 'login' };
  if (isAdmin === true && !user.admin) return { ok: false, redirect: 'welcome' };
  if (isAdmin === false && user.admin) return { ok: false, redirect: 'admin' };
  return { ok: true, user };
}




function resolveRatio(stuhaKey, ratio, ratioCustom) {
  if (stuhaKey === 'custom') return parseFloat(ratioCustom) || 1;
  return parseFloat(ratio) || 1;
}

function calculateCurtain(variables, input) {
  const width = parseFloat(input.width) || 0;
  const height = parseFloat(input.height) || 0;
  const stuhaKey = input.stuha || 'siroky70';
  const ratio = resolveRatio(stuhaKey, input.ratio, input.ratio_custom);
  const stuha = STUHY[stuhaKey] || STUHY.siroky70;

  const consumed = (width * ratio + 20) / 100;

  let price = consumed * varByCode(variables, 'PRIPRAVA');
  price += consumed * stuha.price;
  price += consumed * varByCode(variables, 'RASICI_STUHA');
  price += 2 * (height / 100) * varByCode(variables, 'LEMOVANI');
  price += varByCode(variables, 'KORDOVANI');
  price += consumed * (height / 100) * varByCode(variables, 'ZEHLENI');

  if (input.corners) price += 2 * varByCode(variables, 'OLUVKO_13G');
  if (input.bottom) {
    price += consumed * varByCode(variables, 'OLUVKO');
    price += consumed * varByCode(variables, 'VSITI_OLUVKO');
  }
  if (input.narasit) price += consumed * varByCode(variables, 'RASENI');
  if (input.snails) price += Math.ceil(consumed / 0.08) * varByCode(variables, 'SNECEK');

  // Kanýr – pole ve formuláři, v původním JS chybělo; přidáno podle OBNITKOVANI
  if (input.kanyr) {
    const kanyrHeight = parseFloat(input.kanyr_height) || 0;
    price += (width / 100) * (kanyrHeight / 100) * varByCode(variables, 'OBNITKOVANI');
  }

  return roundPrice(price);
}

function calculateDrape(variables, input) {
  const materialWidth = parseFloat(input.material_width) || 0;
  const width = parseFloat(input.width) || 0;
  const height = parseFloat(input.height) || 0;
  const stuhaKey = input.stuha || 'siroky70';
  const ratio = resolveRatio(stuhaKey, input.ratio, input.ratio_custom);
  const stuha = STUHY[stuhaKey] || STUHY.siroky70;
  const folding = parseFloat(input.folding) || 0;

  const consumed = (width * ratio + 20) / 100;

  let price = consumed * varByCode(variables, 'PRIPRAVA');
  price += consumed * stuha.price;
  price += consumed * varByCode(variables, 'RASICI_STUHA');
  price += 2 * (height / 100) * varByCode(variables, 'LEMOVANI');
  price += varByCode(variables, 'KORDOVANI');
  price += consumed * (height / 100) * varByCode(variables, 'ZEHLENI');
  price += consumed * varByCode(variables, 'USITI_ZALOZKA');

  if (input.corners) price += 2 * varByCode(variables, 'OLUVKO_50G');
  if (input.narasit) price += consumed * varByCode(variables, 'RASENI');
  if (input.snails) price += Math.ceil(consumed / 0.08) * varByCode(variables, 'SNECEK');

  if (materialWidth > 0 && materialWidth < height + 10) {
    const joins = Math.floor((consumed * 100) / (materialWidth + 25));
    price += joins * (height / 100) * varByCode(variables, 'SESITI_DILU');
  }

  if (folding > 0) {
    price += folding * (width / 100) * varByCode(variables, 'NADSITI_ZACLONA');
  }

  if (input.kanyr) {
    const kanyrHeight = parseFloat(input.kanyr_height) || 0;
    price += (width / 100) * (kanyrHeight / 100) * varByCode(variables, 'OBNITKOVANI');
  }

  return roundPrice(price);
}

function calculatePillow(variables, input) {
  const width = parseFloat(input.width) || 0;
  const height = parseFloat(input.height) || 0;
  const stuffing = !!input.stuffing;
  const complex = !!input.complex;

  const size = Math.ceil(width / 10) + Math.ceil(height / 10);

  let price = varByCode(variables, 'POLSTAR_ZAKLAD');
  price += size * varByCode(variables, 'POLSTAR_10CM');
  price += complex ? varByCode(variables, 'USITI_POLSTAR_C') : varByCode(variables, 'USITI_POLSTAR');

  if (stuffing) {
    price += varByCode(variables, 'POLSTAR_VYPLN_MIN_CENA');
    const minSize = varByCode(variables, 'POLSTAR_VYPLN_MIN');
    if (size * 10 > minSize) {
      price += Math.ceil((size * 10 - minSize) / 10) * varByCode(variables, 'POLSTAR_VYPLN_10CM');
    }
  }

  if (input.zipper) {
    price += varByCode(variables, 'USITI_ZALOZKA');
  }

  return roundPrice(price);
}

/**
 * Sedák – původní aplikace chyběla; vzorec odvozen z ceníkových kódů.
 * Ověřte s majitelem firmy před nasazením.
 */
function calculateCushion(variables, input) {
  const width = parseFloat(input.width) || 0;
  const height = parseFloat(input.height) || 0;
  const depth = parseFloat(input.depth) || 8;
  const areaM2 = (width / 100) * (height / 100);

  let price = varByCode(variables, 'USITI_SEDAK');
  price += areaM2 * varByCode(variables, 'PRIPRAVA');

  if (input.foam !== false) {
    const layers = Math.max(1, Math.ceil(depth / 2));
    price += areaM2 * varByCode(variables, 'MOLITAN_2CM') * layers;
  }

  if (input.felt) {
    // ROUNO_025CM2 = cena za jednotku 0,25 cm²; 4 jednotky = 1 cm²
    const units = (width * height) * 4;
    price += (units / 10000) * varByCode(variables, 'ROUNO_025CM2') * 100;
  }

  if (input.ties) {
    price += varByCode(variables, 'USITI_UVAZ');
  }

  return roundPrice(price);
}

/**
 * Římská roleta – původní aplikace chyběla; vzorec od ceníku.
 */
function calculateBlind(variables, input) {
  const width = parseFloat(input.width) || 0;
  const height = parseFloat(input.height) || 0;
  let tunnels = parseInt(input.tunnels, 10);
  if (!tunnels || tunnels < 1) {
    tunnels = Math.max(3, Math.ceil(height / 25));
  }

  let price = varByCode(variables, 'KOMPLET_ROLETA');
  price += (width / 100) * varByCode(variables, 'TUNYLKY_ROLETA');
  price += (height / 100) * varByCode(variables, 'PRIPRAVA');
  price += tunnels * varByCode(variables, 'USITI_ZALOZKA');

  return roundPrice(price);
}





function renderSchema(item) {
  const typeLabel = PRODUCT_TYPES[item.type]?.label || item.type;
  const params = item.params || {};
  const rows = Object.entries(params)
    .filter(([, v]) => v !== '' && v != null && v !== false)
    .map(([k, v]) => `<tr><th>${escapeHtml(labelFor(k))}</th><td>${formatParam(v)}</td></tr>`)
    .join('');

  return `
    <div class="schema-sheet" id="schema-print">
      <header class="schema-header">
        <h2>Výrobní list</h2>
        <p><strong>${escapeHtml(typeLabel)}</strong> · ${item.count || 1}× · č. ${item.item_id || '—'}</p>
      </header>
      <div class="schema-body">
        <div class="schema-diagram">
          ${diagramSvg(item)}
        </div>
        <table class="schema-table">
          <tbody>${rows}</tbody>
        </table>
      </div>
      <footer class="schema-footer">
        <p>Cena bez DPH: ${formatMoney(item.price_net || 0)} Kč · s DPH: ${formatMoney(item.price_vat || 0)} Kč</p>
      </footer>
    </div>
  `;
}

function diagramSvg(item) {
  const w = Math.min(280, parseFloat(item.params?.width) || 120);
  const h = Math.min(200, parseFloat(item.params?.height) || 80);
  const scale = Math.min(240 / w, 160 / h, 1.5);
  const rw = w * scale;
  const rh = h * scale;
  const ox = (300 - rw) / 2;
  const oy = (180 - rh) / 2;

  return `
    <svg viewBox="0 0 300 200" class="schema-svg" aria-label="Náčrt rozměrů">
      <rect x="${ox}" y="${oy}" width="${rw}" height="${rh}" fill="none" stroke="#141b1e" stroke-width="2"/>
      <text x="${ox + rw / 2}" y="${oy + rh + 18}" text-anchor="middle" font-size="12">${w} cm</text>
      <text x="${ox - 8}" y="${oy + rh / 2}" text-anchor="end" font-size="12">${h} cm</text>
    </svg>
  `;
}

function labelFor(key) {
  const map = {
    width: 'Šířka',
    height: 'Výška / délka',
    depth: 'Tloušťka',
    material_width: 'Šířka látky',
    stuha: 'Stuha',
    ratio: 'Koeficient',
    ratio_custom: 'Vlastní koeficient',
    kanyr: 'Kanýr',
    kanyr_height: 'Výška kanýru',
    corners: 'Rohová olůvka',
    bottom: 'Spodní olůvko',
    narasit: 'Nařasit',
    snails: 'Šnečky',
    folding: 'Zalomení',
    stuffing: 'Výplň',
    complex: 'Složitý tvar',
    zipper: 'Zip',
    foam: 'Molitan',
    felt: 'Rouno',
    ties: 'Úvazy',
    tunnels: 'Tunýlky',
    count: 'Počet',
    note: 'Poznámka',
  };
  return map[key] || key;
}

function formatParam(v) {
  if (typeof v === 'boolean') return v ? 'Ano' : 'Ne';
  return escapeHtml(String(v));
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

      return guard(false, (user) => renderStudioPlaceholder(user, 'Plán výroby', 'plan-vyroby'));
    case 'admin':
      return guard(true, renderAdminOrders);
    case 'admin/kalendar':
      return guard(true, (user) => renderAdminPlaceholder(user, 'Kalendář výroby', 'kalendar'));
    case 'admin/cenik':
      return guard(true, renderAdminPricing);
    case 'admin/cenik-stropu':
      return guard(true, (user) => renderAdminPlaceholder(user, 'Ceník stropů', 'cenik-stropu'));
    case 'admin/cenik-rolet':
      return guard(true, (user) => renderAdminPlaceholder(user, 'Ceník rolet', 'cenik-rolet'));
    case 'admin/uzivatele':
      return guard(true, renderAdminUsers);
    case 'potvrzeni':
      return guard(false, renderConfirmation);
    default:
      return navigate('login');
  }
}

function guard(admin, fn) {
  const auth = requireAuth(admin);
  if (!auth.ok) return navigate(auth.redirect);
  // Obrazovky už HTML vykreslí samy; přepsat smíme jen když vrátí řetězec.
  const html = fn(auth.user);
  if (typeof html === 'string') app.innerHTML = html;
  bindCommonEvents(auth.user);
}

function bindCommonEvents(user) {
  app.querySelectorAll('[data-action]').forEach((el) => {
    el.addEventListener('click', (e) => {
      const action = el.dataset.action;
      if (action === 'new-order') {
        const order = createEmptyOrder(user.user_id);
        setDraftOrder(order);
        navigate(`zakazka/${order.order_id}`);
      }
      if (action === 'new-quote') {
        const quote = createEmptyQuote(user.user_id);
        navigate(`studio/nabidka/${quote.quote_id}`);
      }
      if (action === 'open-quote') {
        e.preventDefault();
        navigate(`studio/nabidka/${el.dataset.quoteId}/materialy`);
      }
      if (action === 'delete-quote') {
        e.preventDefault();
        if (confirm('DOPLNIT TEXT')) {
          deleteQuote(parseInt(el.dataset.quoteId, 10));
          render();
        }
      }
      if (action === 'defer-quote') {
        e.preventDefault();
        odlozitNabidku(user);
      }
      if (action === 'quote-continue-materials') {
        e.preventDefault();
        pokracovatNaMaterialyNabidky(user, el.dataset.quoteId);
      }
      if (action === 'order-continue-materials') {
        e.preventDefault();
        pokracovatNaMaterialyZakazky(user, el.dataset.orderId);
      }
      if (action === 'order-action') {
        e.preventDefault();
        handleOrderAction(el.dataset.orderId, el.dataset.nextStatus);
      }
      if (action === 'delete-order') {
        e.preventDefault();
        smazatZakazkuAdminem(el.dataset.orderId);
      }
    });
  });

  const loginForm = document.getElementById('login-form');
  if (loginForm) {
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(loginForm);
      const result = login(fd.get('login'), fd.get('password'));
      const err = document.getElementById('login-error');
      if (!result.ok) {
        err.textContent = result.error;
        err.hidden = false;
        return;
      }
      navigate(result.user.admin ? 'admin' : 'welcome');
    });
  }

  bindProductForms();
  bindQuoteProductForm();
  bindPricingForm();
  bindPricingStuhyForm();
  bindPricingAddForm();
  bindPricingDeleteButtons();
  bindUserForm();
  bindMaterialsForm();
  bindQuoteMaterialsForm();
  bindAdminNav();
}

function bindAdminNav() {
  const prepinac = app.querySelector('[data-admin-nav-toggle]');
  const panel = document.getElementById('admin-sidebar');
  const prekryv = app.querySelector('[data-admin-nav-overlay]');
  if (!prepinac || !panel) {
    return;
  }

  const zavrit = () => {
    panel.classList.remove('is-open');
    if (prekryv) {
      prekryv.hidden = true;
    }
    prepinac.setAttribute('aria-expanded', 'false');
  };

  const otevrit = () => {
    panel.classList.add('is-open');
    if (prekryv) {
      prekryv.hidden = false;
    }
    prepinac.setAttribute('aria-expanded', 'true');
  };

  prepinac.addEventListener('click', () => {
    if (panel.classList.contains('is-open')) {
      zavrit();
    } else {
      otevrit();
    }
  });

  prekryv?.addEventListener('click', zavrit);
  panel.querySelectorAll('a').forEach((odkaz) => {
    odkaz.addEventListener('click', zavrit);
  });
}

function createEmptyOrder(userId) {
  const order = {
    order_id: nextOrderId(),
    user_id: userId,
    status: 2,
    created_at: new Date().toISOString(),
    items: [],
    materials: '',
    deadline: '',
    oznaceni: '',
    submitted: false,
  };
  upsertOrder(order);
  return order;
}

/** Stejné uložení odeslané zakázky pro běžný formulář i pro Cenové nabídky. */
function odeslatObjednavku(order) {
  order.submitted = true;
  order.status = 2;
  upsertOrder(order);
  setDraftOrder(null);
}

function createEmptyQuote(userId) {
  const quote = {
    quote_id: nextQuoteId(),
    user_id: userId,
    created_at: new Date().toISOString(),
    deferred_at: null,
    items: [],
    materials: '',
    deadline: '',
    oznaceni: '',
  };
  upsertQuote(quote);
  return quote;
}

function jeOznaceniVyplnene(quote) {
  return String(quote?.oznaceni || '').trim() !== '';
}

function vlastniNabidka(quoteId, user) {
  const quote = getQuoteById(parseInt(quoteId, 10));
  if (!quote || quote.user_id !== user.user_id) return null;
  return quote;
}

function soucetNabidky(quote) {
  return (quote.items || []).reduce((sum, item) => sum + item.price_vat * item.count, 0);
}

function soucetNabidkyBezDph(quote) {
  return (quote.items || []).reduce((sum, item) => sum + item.price_net * item.count, 0);
}

function getOrder(orderId) {
  const id = parseInt(orderId, 10);
  return getOrderById(id) || getDraftOrder();
}

function renderStudioNabidka(quoteId) {
  const user = currentUser();
  const quote = vlastniNabidka(quoteId, user);
  if (!quote) return navigate('studio/cenove-nabidky');

  const productLinks = Object.entries(PRODUCT_TYPES)
    .map(
      ([key, p]) =>
        `<a href="#/studio/nabidka/${quote.quote_id}/produkt/${key}" class="product-card"><strong>${p.label}</strong><span>Přidat položku</span></a>`
    )
    .join('');

  const itemRows =
    quote.items.length === 0
      ? '<tr><td colspan="4" class="empty">Zakázka je prázdná – přidejte produkt.</td></tr>'
      : quote.items
          .map(
            (item, idx) => `
      <tr>
        <td>${PRODUCT_TYPES[item.type]?.label || item.type}</td>
        <td>${item.count}×</td>
        <td>${formatMoney(item.price_vat * item.count)} Kč</td>
        <td>
          <a href="#/studio/nabidka/${quote.quote_id}/schema/${idx}" class="btn btn-sm">Schéma</a>
          <button type="button" class="btn btn-sm btn-danger" data-remove-quote-item="${idx}">Odebrat</button>
        </td>
      </tr>`
          )
          .join('');

  const chybaOznaceni = nabidkaOznaceniChyba;
  nabidkaOznaceniChyba = false;

  app.innerHTML = shell(
    user,
    `<label for="quote-oznaceni">Název zakázky</label> <input type="text" id="quote-oznaceni" class="quote-oznaceni-pole" value="${esc(quote.oznaceni || '')}" aria-invalid="${chybaOznaceni ? 'true' : 'false'}" aria-describedby="quote-oznaceni-error">`,
    `
    <p id="quote-oznaceni-error" class="form-error"${chybaOznaceni ? '' : ' hidden'}>není vyplněno</p>
    <section class="panel">
      <h2>Přidat produkt</h2>
      <div class="product-grid">${productLinks}</div>
    </section>
    <section class="panel">
      <h2>Položky</h2>
      <table class="data-table">
        <thead><tr><th>Produkt</th><th>Počet</th><th>Cena s DPH</th><th></th></tr></thead>
        <tbody>${itemRows}</tbody>
      </table>
      ${
        quote.items.length
          ? `<div class="toolbar"><button type="button" class="btn btn-primary" data-action="quote-continue-materials" data-quote-id="${quote.quote_id}">Pokračovat na materiály</button></div>`
          : ''
      }
    </section>`,
    { mode: 'customer', active: 'cenove-nabidky' }
  );

  const poleOznaceni = document.getElementById('quote-oznaceni');
  const hlaseniOznaceni = document.getElementById('quote-oznaceni-error');
  if (poleOznaceni) {
    poleOznaceni.addEventListener('input', () => {
      quote.oznaceni = poleOznaceni.value;
      upsertQuote(quote);
      poleOznaceni.setAttribute('aria-invalid', 'false');
      if (hlaseniOznaceni) hlaseniOznaceni.hidden = true;
    });

      if (e.key !== 'Enter' || !quote.items.length) return;
      e.preventDefault();
      pokracovatNaMaterialyNabidky(user, quote.quote_id);

  }

  app.querySelectorAll('[data-remove-quote-item]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.removeQuoteItem, 10);
      quote.items.splice(idx, 1);

      render();

  });

/** Klíč z názvu: bez diakritiky, bez mezer, unikátní. */
function kodZNazvu(name, used) {
  const zaklad =
    String(name)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-zA-Z0-9]+/g, '_')
      .replace(/^_|_$/g, '')
      .toUpperCase() || 'RADKA';
  let code = zaklad;
  let n = 2;
  while (used.has(code)) {
    code = `${zaklad}_${n}`;
    n += 1;
  }
  return code;
}

function dalsiVarId(variables) {
  const max = variables.reduce((m, v) => {
    const n = parseInt(v.var_id, 10);
    return Number.isFinite(n) ? Math.max(m, n) : m;
  }, 0);
  return String(max + 1);
}

function bindPricingAddForm() {
  const form = document.getElementById('pricing-add-form');
  if (!form) return;
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const err = document.getElementById('pricing-add-error');
    const fd = new FormData(form);
    const name = String(fd.get('name') ?? '').trim();
    const unit = String(fd.get('unit') ?? '').trim();
    const rawValue = String(fd.get('value') ?? '').trim().replace(',', '.');
    const value = Number(rawValue);

    let hlaska = '';
    if (!name) hlaska = 'Zadejte název.';
    else if (!unit) hlaska = 'Zadejte jednotku (například m2, m, km nebo ks).';
    else if (rawValue === '' || !Number.isFinite(value) || value < 0) {
      hlaska = 'Zadejte cenu jako číslo 0 nebo větší.';
    }
    if (hlaska) {
      err.textContent = hlaska;
      err.hidden = false;
      return;
    }

    const variables = pricingFromForm();
    const code = kodZNazvu(
      name,
      new Set(variables.map((v) => v.code))
    );
    variables.push({
      var_id: dalsiVarId(variables),
      name,
      code,
      unit,
      value: String(value),
      custom: true,
    });
    saveVariables(variables);
    render();
  });
}

    ? `<label for="order-oznaceni">Název zakázky</label> <input type="text" id="order-oznaceni" class="quote-oznaceni-pole" value="${esc(order.oznaceni || '')}" aria-invalid="${chybaOznaceni ? 'true' : 'false'}" aria-describedby="order-oznaceni-error">`
    : `Zakázka č. ${order.order_id}`;

    ? jeStudio
      ? `<div class="toolbar"><button type="button" class="btn btn-primary" data-action="order-continue-materials" data-order-id="${order.order_id}">Pokračovat na materiály</button></div>`
      : `<div class="toolbar"><a href="#/materialy/${order.order_id}" class="btn btn-primary">Pokračovat na materiály</a></div>`
    : '';

    user,

  const hlaseniOznaceni = document.getElementById('order-oznaceni-error');
  if (poleOznaceni) {
    poleOznaceni.addEventListener('input', () => {
      order.oznaceni = poleOznaceni.value;
      upsertOrder(order);
      setDraftOrder(order);
      poleOznaceni.setAttribute('aria-invalid', 'false');
      if (hlaseniOznaceni) hlaseniOznaceni.hidden = true;

  app.querySelectorAll('[data-remove-item]').forEach((btn) => {

function pokracovatNaMaterialyZakazky(user, orderId) {
  const order = getOrder(parseInt(orderId, 10));
  if (!order || order.user_id !== user.user_id) return navigate('welcome');

  const pole = document.getElementById('order-oznaceni');
  if (pole) order.oznaceni = pole.value;

  navigate(`materialy/${order.order_id}`);
}

function defaultParams(type) {
  const base = { count: 1, width: 120, height: 80 };
  if (type === 'curtain' || type === 'drape') {
    return { ...base, stuha: 'siroky70', ratio: '2', material_width: 140, folding: 0 };
  }
  if (type === 'cushion') return { ...base, depth: 8, foam: true, felt: false, ties: false };
  if (type === 'blind') return { ...base, tunnels: 4 };
  if (type === 'pillow') return { ...base, stuffing: true, complex: false, zipper: false };
  return base;
}

function productFormHtml(type, d) {
  const common = `
    <label>Šířka (cm)<input type="number" step="0.1" name="width" id="width" value="${d.width}" required></label>
    <label>Výška (cm)<input type="number" step="0.1" name="height" id="height" value="${d.height}" required></label>
    <label>Počet kusů<input type="number" min="1" name="count" id="count" value="${d.count}" required></label>
    <label>Poznámka<textarea name="note" rows="2"></textarea></label>`;

  if (type === 'curtain' || type === 'drape') {
    const stuhaOpts = Object.keys(STUHY)
      .map((k) => `<option value="${k}" ${d.stuha === k ? 'selected' : ''}>${k}</option>`)
      .join('');
    const extra =
      type === 'drape'
        ? `<label>Šířka látky (cm)<input type="number" name="material_width" id="material_width" value="${d.material_width}"></label>
           <label>Zalomení<input type="number" step="0.1" name="folding" id="folding" value="${d.folding}"></label>`
        : '';
    return `
      ${extra}
      <label>Stuha<select name="stuha" id="stuha">${stuhaOpts}</select></label>
      <label>Koeficient<select name="ratio" id="ratio">${ratioOptions(d.stuha, d.ratio)}</select></label>
      <label>Vlastní koeficient<input type="number" step="0.01" name="ratio_custom" id="ratio_custom" value="2"></label>
      <label class="checkbox"><input type="checkbox" name="kanyr" id="kanyr"> Kanýr</label>
      <label>Výška kanýru (cm)<input type="number" name="kanyr_height" id="kanyr_height" value="15"></label>
      <label class="checkbox"><input type="checkbox" name="corners" id="corners"> Rohová olůvka</label>
      ${type === 'curtain' ? '<label class="checkbox"><input type="checkbox" name="bottom" id="bottom"> Spodní olůvko</label>' : ''}
      <label class="checkbox"><input type="checkbox" name="narasit" id="narasit"> Nařasit</label>
      <label class="checkbox"><input type="checkbox" name="snails" id="snails"> Šnečky</label>
      ${common}`;
  }

  if (type === 'pillow') {
    return `
      ${common}
      <label class="checkbox"><input type="checkbox" name="stuffing" id="stuffing" ${d.stuffing ? 'checked' : ''}> Výplň</label>
      <label class="checkbox"><input type="checkbox" name="complex" id="complex"> Složitý tvar</label>
      <label class="checkbox"><input type="checkbox" name="zipper" id="zipper"> Zip</label>`;
  }

  if (type === 'cushion') {
    return `
      ${common.replace('Výška', 'Délka')}
      <label>Tloušťka (cm)<input type="number" step="0.1" name="depth" id="depth" value="${d.depth}"></label>
      <label class="checkbox"><input type="checkbox" name="foam" id="foam" checked> Molitan</label>
      <label class="checkbox"><input type="checkbox" name="felt" id="felt"> Rouno</label>
      <label class="checkbox"><input type="checkbox" name="ties" id="ties"> Úvazy</label>`;
  }

  if (type === 'blind') {
    return `
      ${common}
      <label>Počet tunýlků<input type="number" min="1" name="tunnels" id="tunnels" value="${d.tunnels}"></label>`;
  }

  return common;
}

function ratioOptions(stuhaKey, selected) {
  const stuha = STUHY[stuhaKey] || STUHY.siroky70;
  const ratios = stuha.ratios.length ? stuha.ratios : ['1.5', '2', '2.5'];
  return ratios.map((r) => `<option value="${r}" ${r === selected ? 'selected' : ''}>${r}</option>`).join('');
}

function readProductForm(type) {
  const form = document.getElementById('product-form') || document.getElementById('quote-product-form');
  const fd = new FormData(form);
  const input = {};
  fd.forEach((v, k) => {
    input[k] = v;
  });
  ['kanyr', 'corners', 'bottom', 'narasit', 'snails', 'stuffing', 'complex', 'zipper', 'foam', 'felt', 'ties'].forEach(
    (k) => {
      input[k] = fd.has(k);
    }
  );
  if (type === 'cushion' && !fd.has('foam')) input.foam = false;
  return input;
}

function updateProductPrice(type) {
  const variables = getVariables();
  const input = readProductForm(type);
  const calc = CALCULATORS[type];
  if (!calc) return;

  const net = calc(variables, input);
  const netVat = withVat(net, variables);
  const count = parseInt(input.count, 10) || 1;

  document.getElementById('price-unit').textContent = formatMoney(net);
  document.getElementById('price-total').textContent = formatMoney(net * count);
  document.getElementById('price-unit-vat').textContent = formatMoney(netVat);
  document.getElementById('price-total-vat').textContent = formatMoney(netVat * count);
}

function bindQuoteProductForm() {
  const form = document.getElementById('quote-product-form');
  if (!form) return;

  const type = form.dataset.type;
  form.querySelectorAll('input, select, textarea').forEach((el) => {
    el.addEventListener('input', () => updateProductPrice(type));
    el.addEventListener('change', () => {
      if (el.id === 'stuha') refreshRatioSelect(el.value);
      updateProductPrice(type);
    });
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const quoteId = parseInt(form.dataset.quoteId, 10);
    const quote = getQuoteById(quoteId);
    if (!quote) return navigate('studio/cenove-nabidky');
    const variables = getVariables();
    const input = readProductForm(type);
    const net = CALCULATORS[type](variables, input);
    const netVat = withVat(net, variables);
    const count = parseInt(input.count, 10) || 1;

    quote.items.push({
      item_id: `${quoteId}-${quote.items.length + 1}`,
      type,
      count,
      params: { ...input },
      price_net: net,
      price_vat: netVat,
    });
    upsertQuote(quote);
    navigate(`studio/nabidka/${quoteId}`);
  });
}

function odlozitNabidku(user) {
  const quoteId = parseInt(route().parts[2], 10);
  const quote = vlastniNabidka(quoteId, user);
  if (!quote) return navigate('studio/cenove-nabidky');

  const form = document.getElementById('quote-materials-form');
  if (form) {
    const fd = new FormData(form);
    quote.materials = fd.get('materials') || '';
    quote.deadline = fd.get('deadline') || '';
  }
  quote.deferred_at = new Date().toISOString();
  upsertQuote(quote);
  navigate('studio/cenove-nabidky');
}

function bindQuoteMaterialsForm() {
  const form = document.getElementById('quote-materials-form');
  if (!form) return;

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const quoteId = parseInt(route().parts[2], 10);
    const quote = getQuoteById(quoteId);
    if (!quote) return navigate('studio/cenove-nabidky');

    const fd = new FormData(form);
    quote.materials = fd.get('materials');
    quote.deadline = fd.get('deadline');
    upsertQuote(quote);

    let order = null;
    try {
      order = createEmptyOrder(quote.user_id);
      order.items = (quote.items || []).map((item, i) => ({
        ...item,
        item_id: `${order.order_id}-${i + 1}`,
        params: { ...(item.params || {}) },
      }));
      order.materials = quote.materials;
      order.deadline = quote.deadline;
      order.oznaceni = quote.oznaceni || '';
      odeslatObjednavku(order);
    } catch {
      if (order?.order_id != null) deleteOrder(order.order_id);
      return;
    }
    deleteQuote(quote.quote_id);
    navigate('potvrzeni');
  });
}

function bindProductForms() {
  const form = document.getElementById('product-form');
  if (!form) return;

  const type = form.dataset.type;
  form.querySelectorAll('input, select, textarea').forEach((el) => {
    el.addEventListener('input', () => updateProductPrice(type));
    el.addEventListener('change', () => {
      if (el.id === 'stuha') refreshRatioSelect(el.value);
      updateProductPrice(type);
    });
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const orderId = parseInt(form.dataset.orderId, 10);
    const order = getOrder(orderId);
    const variables = getVariables();
    const input = readProductForm(type);
    const net = CALCULATORS[type](variables, input);
    const netVat = withVat(net, variables);
    const count = parseInt(input.count, 10) || 1;

    const item = {
      item_id: `${orderId}-${order.items.length + 1}`,
      type,
      count,
      params: { ...input },
      price_net: net,
      price_vat: netVat,
    };

    order.items.push(item);
    upsertOrder(order);
    setDraftOrder(order);
    navigate(`zakazka/${orderId}`);
  });
}

function refreshRatioSelect(stuhaKey) {
  const select = document.getElementById('ratio');
  if (!select) return;
  select.innerHTML = ratioOptions(stuhaKey, STUHY[stuhaKey]?.ratios[0]);
}

function renderSchemaPage(orderId, itemIdx) {
  const user = currentUser();
  const order = getOrder(orderId);
  const item = order?.items[parseInt(itemIdx, 10)];
  if (!item) return navigate(`zakazka/${orderId}`);

  app.innerHTML = shell(
    user,
    'Výrobní schéma',
    `
    ${renderSchema(item)}
    <div class="toolbar">
      <button type="button" class="btn btn-muted" onclick="window.print()">Tisk</button>
      <a href="#/zakazka/${orderId}" class="btn btn-primary">Zpět na zakázku</a>
    </div>`,
    { mode: 'customer' }
  );
}

function renderMaterials(orderId) {
  const user = currentUser();
  const order = getOrder(orderId);
  if (!order || !order.items.length) return navigate(`zakazka/${orderId}`);
  if (!user.admin && !jeOznaceniVyplnene(order)) {
    zakazkaOznaceniChyba = true;
    return navigate(`zakazka/${orderId}`);
  }

  app.innerHTML = shell(
    user,
    'Soupis materiálu',
    `
    <form id="materials-form" class="form form-narrow">
      <label for="materials-text">Materiály (látka, barva, dodavatel…)
        <textarea id="materials-text" name="materials" rows="6" required>${esc(order.materials || '')}</textarea>
      </label>
      <label for="deadline">Termín dodání
        <input type="date" id="deadline" name="deadline" value="${order.deadline || ''}" required>
      </label>
      <div class="toolbar">
        <a href="#/zakazka/${orderId}" class="btn btn-muted">Zpět</a>
        <button type="submit" class="btn btn-primary">Odeslat objednávku</button>
      </div>
    </form>`,
    { mode: 'customer' }
  );
}

function bindMaterialsForm() {
  const form = document.getElementById('materials-form');
  if (!form) return;
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const orderId = parseInt(route().parts[1], 10);
    const order = getOrder(orderId);
    const fd = new FormData(form);
    order.materials = fd.get('materials');
    order.deadline = fd.get('deadline');
    odeslatObjednavku(order);
    navigate('potvrzeni');
  });
}

function renderConfirmation() {
  const user = currentUser();
  app.innerHTML = shell(
    user,
    'Objednávka odeslána',
    `
    <div class="success-box">
      <p>Děkujeme. Vaše objednávka byla odeslána ke zpracování.</p>
      <a href="#/welcome" class="btn btn-primary">Zpět na přehled zakázek</a>
    </div>`,
    { mode: 'customer' }
  );
}

function getUserName(userId) {
  const u = getUsers().find((x) => x.user_id === userId);
  return u?.name || `#${userId}`;
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('cs-CZ');
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/"/g, '&quot;');
}

window.addEventListener('error', (event) => {
  const box = document.getElementById('app');
  if (!box) return;
  box.innerHTML = `<p class="form-error">Chyba aplikace: ${esc(event.message)}</p>`;
});

window.addEventListener('unhandledrejection', (event) => {
  const box = document.getElementById('app');
  if (!box) return;
  box.innerHTML = `<p class="form-error">Chyba aplikace: ${esc(event.reason)}</p>`;
});

start();

/** Odhlásí i Laravel relaci (CSRF vkládá B2bAppController) a přejde na /b2b. */
function odhlasitZLaravelu() {
  const token = window.__TNM_CSRF;
  fetch('/logout', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
      'X-CSRF-TOKEN': token,
      Accept: 'text/html',
    },
    body: `_token=${encodeURIComponent(token)}`,
    credentials: 'same-origin',
  }).finally(() => {
    location.href = '/b2b';
  });
}

function start() {
  initStorage();
  const user = currentUser();
  if (user && (!location.hash || location.hash === '#' || location.hash === '#/')) {
    navigate(user.admin ? 'admin' : 'welcome');
    return;
  }
  render();
}
